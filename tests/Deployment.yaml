apiVersion: apps/v1

kind: Deployment

metadata:
  name: flask-deployment

spec:

  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:

    metadata:
      labels:
        app: flask

    spec:

      containers:

        - name: flask

          image: abombale/flask-app:latest

          ports:

            - containerPort: 5000

          readinessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20